services:
  web:
    build:
      context: .
      dockerfile: ./docker/nginx/Dockerfile
    container_name: vichan_web
    restart: unless-stopped
    volumes:
      - ./local-instances/${INSTANCE:-0}/www:/var/www/html
      - ./docker/nginx/vichan.conf:/etc/nginx/conf.d/default.conf
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/nginx/proxy.conf:/etc/nginx/conf.d/proxy.conf
#      - ./docker/nginx/ssl:/etc/nginx/ssl # optional For SSL
    ports:
      - "9080:80"
#      - "9081:443" # optional for SSL
    depends_on:
      - db
      - php
    links:
      - php

  php:
    build:
      context: .
      dockerfile: ./docker/php/Dockerfile
    container_name: vichan_php
    restart: unless-stopped
    volumes:
      - ./local-instances/${INSTANCE:-0}/www:/var/www
      - ./docker/php/www.conf:/usr/local/etc/php-fpm.d/www.conf
      - ./docker/php/sse.conf:/usr/local/etc/php-fpm.d/sse.conf
      - ./docker/php/jit.ini:/usr/local/etc/php/conf.d/jit.ini
      - ./docker/php/php.ini:/usr/local/etc/php/php.ini
      # Falco writes JSON alerts here; the mod panel (?/falco) reads them read-only.
      - ./local-instances/${INSTANCE:-0}/falco:/var/falco:ro
    environment:
      # Database settings
      VICHAN_MYSQL_HOST: ${VICHAN_MYSQL_HOST}
      VICHAN_MYSQL_USER: ${VICHAN_MYSQL_USER}
      VICHAN_MYSQL_NAME: ${VICHAN_MYSQL_NAME}
      VICHAN_MYSQL_PASSWORD: ${VICHAN_MYSQL_PASSWORD}
      # Security
      VICHAN_SECURE_LOGIN_ONLY: ${VICHAN_SECURE_LOGIN_ONLY}
      # Cache settings
      VICHAN_CACHE_ENGINE: ${VICHAN_CACHE_ENGINE}
      VICHAN_CACHE_HOST: ${VICHAN_CACHE_HOST}
      VICHAN_CACHE_PORT: ${VICHAN_CACHE_PORT}
      VICHAN_CACHE_PASSWORD: ${VICHAN_CACHE_PASSWORD}
      # ClamAV upload scanning
      VICHAN_CLAMAV_ENABLED: ${VICHAN_CLAMAV_ENABLED:-0}
      VICHAN_CLAMAV_HOST: ${VICHAN_CLAMAV_HOST:-clamav}
      VICHAN_CLAMAV_PORT: ${VICHAN_CLAMAV_PORT:-3310}
      VICHAN_CLAMAV_FAIL_CLOSED: ${VICHAN_CLAMAV_FAIL_CLOSED:-0}
      # NSFW image filtering (Yahoo open_nsfw). Per-board policy is managed at ?/nsfw; these are
      # the master switch (ENABLED) and the fallback defaults used until a policy row exists.
      VICHAN_NSFW_ENABLED: ${VICHAN_NSFW_ENABLED:-0}
      VICHAN_NSFW_HOST: ${VICHAN_NSFW_HOST:-nsfw}
      VICHAN_NSFW_PORT: ${VICHAN_NSFW_PORT:-8080}
      VICHAN_NSFW_DEFAULT_ENABLED: ${VICHAN_NSFW_DEFAULT_ENABLED:-0}
      VICHAN_NSFW_THRESHOLD: ${VICHAN_NSFW_THRESHOLD:-0.8}
      VICHAN_NSFW_ACTION: ${VICHAN_NSFW_ACTION:-reject}
      VICHAN_NSFW_FAIL_CLOSED: ${VICHAN_NSFW_FAIL_CLOSED:-0}
      # Cookies
      VICHAN_COOKIES_MOD: ${VICHAN_COOKIES_MOD}
      # Flood Control
      VICHAN_FLOOD_TIME: ${VICHAN_FLOOD_TIME}
      VICHAN_FLOOD_TIME_IP: ${VICHAN_FLOOD_TIME_IP}
      VICHAN_FLOOD_TIME_SAME: ${VICHAN_FLOOD_TIME_SAME}
      VICHAN_MAX_BODY: ${VICHAN_MAX_BODY}
      VICHAN_REPLY_LIMIT: ${VICHAN_REPLY_LIMIT}
      VICHAN_MAX_LINKS: ${VICHAN_MAX_LINKS}
      # Images
      VICHAN_IMAGES_MAX_FILESIZE: ${VICHAN_IMAGES_MAX_FILESIZE}
      VICHAN_IMAGES_THUMB_WIDTH: ${VICHAN_IMAGES_THUMB_WIDTH}
      VICHAN_IMAGES_THUMB_HEIGHT: ${VICHAN_IMAGES_THUMB_HEIGHT}
      VICHAN_IMAGES_MAX_WIDTH: ${VICHAN_IMAGES_MAX_WIDTH}
      VICHAN_IMAGES_MAX_HEIGHT: ${VICHAN_IMAGES_MAX_HEIGHT}
      # Display
      VICHAN_DISPLAY_THREADS_PER_PAGE: ${VICHAN_DISPLAY_THREADS_PER_PAGE}
      VICHAN_DISPLAY_MAX_PAGES: ${VICHAN_DISPLAY_MAX_PAGES}
      VICHAN_DISPLAY_THREADS_PREVIEW: ${VICHAN_DISPLAY_THREADS_PREVIEW}
      # Directories
      VICHAN_DIRECTORIES_ROOT: ${VICHAN_DIRECTORIES_ROOT}
    depends_on:
      - db
      - clamav
      - nsfw

  db:
    image: mysql:lts
    # image: mariadb:lts # optional for more higher performance
    container_name: vichan_db
    restart: unless-stopped
    volumes:
      - ./local-instances/${INSTANCE:-0}/db:/var/lib/mysql
    # ports:
    #   - "9082:3306" # optional for external access
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

  redis:
    image: redis:latest
    container_name: vichan_redis
    restart: unless-stopped
    volumes:
      - ./local-instances/${INSTANCE:-0}/redis:/data
    environment:
      REDIS_PASSWORD: ${VICHAN_CACHE_PASSWORD}
    command: redis-server --requirepass ${VICHAN_CACHE_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${VICHAN_CACHE_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Malware scanning of uploads. clamd listens on 3310 (compose network only); post.php streams
  # each uploaded file to it (inc/clamav.php) and rejects anything a signature matches. The
  # signature DB is persisted so it is not re-downloaded (~hundreds of MB) on every restart.
  # NOTE: clamd holds the signatures in RAM (~1-2 GB). Make sure the host has the headroom, or
  # leave VICHAN_CLAMAV_ENABLED=0 to keep the service off.
  clamav:
    image: clamav/clamav:latest
    container_name: vichan_clamav
    restart: unless-stopped
    volumes:
      - ./local-instances/${INSTANCE:-0}/clamav:/var/lib/clamav
      - ./docker/clamav/clamd.conf:/etc/clamav/clamd.conf:ro
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # Runtime threat detection. Falco watches syscalls (modern eBPF — no kernel headers needed) and
  # container activity, writing JSON alerts that the mod panel (?/falco) reads and displays. It
  # needs deep host access (privileged + /proc + the docker socket); that is inherent to
  # host-level monitoring, not specific to this setup.
  falco:
    image: falcosecurity/falco:latest
    container_name: vichan_falco
    restart: unless-stopped
    privileged: true
    pid: "host"
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock:ro
      - /proc:/host/proc:ro
      - /etc:/host/etc:ro
      - ./docker/falco/falco.yaml:/etc/falco/falco.yaml:ro
      - ./docker/falco/rules.d:/etc/falco/rules.d:ro
      - ./local-instances/${INSTANCE:-0}/falco:/var/log/falco
    environment:
      - HOST_ROOT=/host

  # NSFW image classifier — Yahoo open_nsfw (via the opennsfw2 TensorFlow port). post.php scores
  # each uploaded image against this service and applies the per-board policy set at ?/nsfw
  # (reject or spoiler). Internal only (no host port). NOTE: TensorFlow needs real RAM
  # (~0.5-1 GB) and the image is large; the build downloads the model weights once. Leave
  # VICHAN_NSFW_ENABLED=0 on a small host to keep it off.
  nsfw:
    build:
      context: ./docker/nsfw
      dockerfile: Dockerfile
    container_name: vichan_nsfw
    restart: unless-stopped
    expose:
      - "8080"

  # One-shot schema migration. `docker compose up` rebuilds code but never applies
  # install.sql, so tables added to the schema later (e.g. nntp_settings, deleted_thread)
  # would be missing until created by hand. This service waits for the database, then
  # applies every `CREATE TABLE IF NOT EXISTS` from install.sql. The two seed INSERTs are
  # stripped, so no existing table or row is touched; it then exits. Best effort — it does
  # not gate the other services.
  migrate:
    image: mysql:lts
    container_name: vichan_migrate
    restart: "no"
    depends_on:
      - db
    volumes:
      - ./install.sql:/install.sql:ro
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    entrypoint:
      - sh
      - -c
      - |
        echo "migrate: waiting for database...";
        i=0; while [ $$i -lt 60 ]; do mysqladmin ping -h db -u root -p"$$MYSQL_ROOT_PASSWORD" --silent 2>/dev/null && break; i=$$((i+1)); sleep 2; done;
        echo "migrate: applying schema (CREATE-only, seed INSERTs stripped)...";
        sed '/^INSERT INTO/,/;[[:space:]]*$$/d' /install.sql | mysql -h db -u root -p"$$MYSQL_ROOT_PASSWORD" "$$MYSQL_DATABASE" && echo "migrate: schema up to date." || echo "migrate: FAILED (see logs above).";