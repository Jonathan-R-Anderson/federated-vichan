[www]
access.log = /proc/self/fd/2

; Ensure worker stdout and stderr are sent to the main error log.
catch_workers_output = yes
decorate_workers_output = no

user = www-data
group = www-data

; Listen on all interfaces (NOT 127.0.0.1), so nginx in the separate `web` container can reach
; php-fpm at php:9000. Binding to loopback causes "502 Bad Gateway" for every request.
listen = 9000
pm = static
pm.max_children = 16
